<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매핑 테스트</title>
<style>
  body { margin: 0; padding: 16px; font: 13px/1.45 -apple-system, "Malgun Gothic", sans-serif; color: #191f28; background: #fff; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.lead { color: #666; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #e5e8eb; padding: 6px 8px; vertical-align: top; text-align: left; }
  th { background: #f2f4f6; font-weight: 600; white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; display: block; }
  .ok { color: #1a7f37; } .warn { color: #c8102e; } .muted { color: #8b95a1; }
  details { margin-top: 2px; } summary { cursor: pointer; color: #3182f6; }
  ul { margin: 2px 0 0; padding-left: 16px; }
</style>
</head>
<body>
<h1>'이 사진처럼 찍기' 매핑 테스트 (mock)</h1>
<p class="lead" id="lead">바디 6D2 · 현재 렌즈 EF 50mm f/1.8 · 내 렌즈 [24-105, 50mm] 고정. 샘플 9장을 mock 분석 → 현재 상황 3가지로 matchFeatures.</p>
<div id="out">실행 중…</div>
<script src="js/data.js"></script>
<script src="js/exposure.js"></script>
<script src="js/dials.js"></script>
<script src="js/exif.js"></script>
<script src="js/mock-features.js"></script>
<script src="js/analyze.js"></script>
<script src="js/match.js"></script>
<script>
(async function run() {
  const CAM = 'eos6d2', LENS = 'ef50', OWNED = ['ef24105', 'ef50'];
  const CURRENT = ['outdoorSunny', 'indoorEvening', 'nightPortrait'];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const files = STYLES.map((s) => new File([''], s.id + '.jpg', { type: 'image/jpeg' }));
  const feats = await Promise.all(files.map((f) => analyzeImage(f, 'mock')));
  const rows = STYLES.map((st, i) => {
    const f = feats[i];
    const cells = CURRENT.map((sc) => {
      const m = matchFeatures(f, sc, null, CAM, LENS, OWNED);
      const r = m.settings;
      const mode = r.mode === 'Av' ? (r.cmode || 'Av') : 'M';
      return `<td>
        <div><b>${m.possible.length}</b> 가능 / <b class="${m.impossible.length ? 'warn' : 'ok'}">${m.impossible.length}</b> 불가</div>
        <div class="num">f/${r.aperture} · EC ${fmtEC(r.ec)} · ${mode} · ${fmtShutter(r.shutter)} · ISO ${r.iso}</div>
        <div class="muted">피사체 ${m.subjectId}${m.moveTip ? ' · 이동: ' + esc(m.moveTip) : ''}</div>
        <details><summary>상세</summary>
          <ul>${m.possible.map((p) => `<li class="ok">${esc(p.what)} — ${esc(p.how)}</li>`).join('')}
          ${m.impossible.map((p) => `<li class="warn">${esc(p.what)} — ${esc(p.why)} → ${esc(p.alt)}${p.linkSceneId ? ' [' + p.linkSceneId + ']' : ''}</li>`).join('')}</ul>
          <div class="muted">${esc(m.colorTips.ps || '픽처스타일 조정 없음')} / ${esc(m.colorTips.edit)}</div>
        </details></td>`;
    }).join('');
    const m0 = matchFeatures(f, CURRENT[0], null, CAM, LENS, OWNED);
    const lw = m0.lensWarning ? `<span class="warn">${esc(m0.lensWarning.need)}</span><br><span class="muted">가능 렌즈: ${m0.lensWarning.okLenses.join(', ') || '없음'}</span>` : '<span class="ok">없음</span>';
    return `<tr>
      <td><img src="${st.image}" alt=""><div class="muted">${st.id}</div></td>
      <td>${esc(m0.summary)}<div class="muted">${esc(f.notes.join(' / '))}</div></td>
      <td class="num">${m0.sameSceneId || '<span class="muted">null</span>'}</td>
      ${cells}
      <td>${lw}</td>
    </tr>`;
  });
  document.getElementById('out').innerHTML = `<table>
    <thead><tr><th>사진</th><th>summary</th><th>sameSceneId</th>${CURRENT.map((c) => `<th>현재: ${byId(SCENES, c).label}</th>`).join('')}<th>lensWarning</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table>`;
  // 콘솔 검증: 숫자 필드가 features에 섞여도 버려지는지
  const junk = validateFeatures({ light: 'sunny', fNumber: 1.8, iso: 3200, dof: 'bogus', color: { warmth: 'warm' } });
  console.assert(!('fNumber' in junk) && junk.dof === 'medium' && junk.light === 'sunny', 'validateFeatures 실패');
  try { await analyzeImage(files[0], 'gemini'); } catch (e) { console.log('gemini 모드:', e.message); }
})();
</script>
</body>
</html>
